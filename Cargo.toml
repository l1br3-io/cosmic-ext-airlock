[package]
name = "cosmic-ext-airlock"
version = "0.4.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "Workspace-isolated Alt+Tab switcher for the COSMIC desktop"
repository = "https://github.com/l1br3-io/cosmic-ext-airlock"
homepage = "https://github.com/l1br3-io/cosmic-ext-airlock"
readme = "README.md"
keywords = ["cosmic", "wayland", "alt-tab", "switcher", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]
# Crate = source + README + LICENSE + assets the tests reference. The
# agent skill pack, docs, and VM plumbing stay in the repository.
exclude = [
    "AGENTS.md",
    ".agents",
    ".opencode",
    ".zcode",
    ".zcodeignore",
    "docs",
    "scripts",
    "justfile",
    "skills-lock.json",
    "PRODUCT.md",
]

[[bin]]
name = "airlock"
path = "src/main.rs"

[dependencies]
cosmic-client-toolkit = "0.2.0"
# The card's typeface, per docs/research/cosmic-appearance-stores.md and
# the typography spec: fontdb discovery, harfrust/skrifa shaping, swash
# rasterization — the platform text stack, pure Rust. Features pinned to
# `std` + `swash`: the default set would link the C fontconfig through
# fontdb; without it fontdb scans the standard font directories itself
# (stated limitation: fontconfig-customized paths are unseen). No C in
# the tree — the PPA vendored-crate constraint (pinned per commit via
# `cargo tree -i cosmic-text`).
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
# App icons, per docs/research/switcher-ux-and-icons.md §3.4: pop-launcher's
# pipeline. Entries: app_id → icon name (gettext off — no C binding, icon()
# is locale-independent). Icons: name → themed file (SVG or PNG path).
# resvg rasterizes the SVGs the Pop/Cosmic themes ship (no-text build drops
# the font stack; embedded raster <image> elements degrade to dropped).
# png decodes the raster icons hicolor/pixmaps carry.
freedesktop-desktop-entry = { version = "0.8", default-features = false }
freedesktop-icons = { version = "0.4", default-features = false }
png = { version = "0.17", default-features = false }
resvg = { version = "0.45.1", default-features = false }
# Settings parsing only: hand-walked `toml::Value`, no derive macros.
# Verified-minimal features: Value itself is gated on `serde` (we still
# never derive), FromStr needs `parse`, fs/env need `std`; only `display`
# is trimmed from the default set.
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
# Test-only schema check for the `custom` shortcuts file: parse what
# install emits against a faithful replica of cosmic's Binding map, so a
# serialization cosmic rejects (0.1.0's `key: Some(..)`) can never ship
# again. Matches the ron line cosmic-config reads with (plain
# `ron::from_str`, default options).
ron = "0.9"
serde = { version = "1", features = ["derive"] }

